# Publishes n8n-nodes-flyn to npm with provenance.
#
# Provenance is not optional: npm has required it for new community-node
# publishes since 1 May 2026, and a package without it is rejected by n8n's
# verification. It needs `id-token: write` here AND a trusted-publisher link, or
# an NPM_TOKEN with provenance enabled, configured on the npm side.
#
# Trigger: push a tag like v0.1.0.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22, not 20, deliberately. npm's trusted publishing (OIDC) requires
          # npm >= 11.5.1 AND Node >= 22.14.0, so a Node 20 runner cannot use it at
          # all and would silently fall back to needing a token.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # --ignore-scripts is load-bearing. n8n-workflow pulls in isolated-vm, a
      # native module that fails to compile against Node 20's V8 on the Linux
      # runners. Nothing here ever runs n8n: lint and tsc need only the
      # TypeScript types, so skipping install scripts is both correct and much
      # faster.
      # The npm bundled with Node 20/22 is 10.x. Trusted publishing (OIDC, no
      # token at all) needs npm >= 11.5, and provenance is happiest on current
      # npm too. Upgrading here means BOTH routes work: trusted publisher if one
      # is configured on npmjs.com, NPM_TOKEN if not.
      - name: Use current npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Publish
        # NODE_AUTH_TOKEN is only consulted when a secret exists. With a trusted
        # publisher configured on npmjs.com it is empty and OIDC is used instead,
        # which is the better setup because there is no long-lived token to leak.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
