# Publishes n8n-nodes-flyn to npm with provenance.
#
# Provenance is not optional: npm has required it for new community-node
# publishes since 1 May 2026, and a package without it is rejected by n8n's
# verification. It needs `id-token: write` here AND a trusted-publisher link, or
# an NPM_TOKEN with provenance enabled, configured on the npm side.
#
# Trigger: push a tag like v0.1.0.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for provenance
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # --ignore-scripts is load-bearing. n8n-workflow pulls in isolated-vm, a
      # native module that fails to compile against Node 20's V8 on the Linux
      # runners. Nothing here ever runs n8n: lint and tsc need only the
      # TypeScript types, so skipping install scripts is both correct and much
      # faster.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $TAG does not match package.json version $PKG" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
